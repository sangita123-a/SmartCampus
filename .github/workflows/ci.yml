name: SmartCampus CI/CD Pipeline

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    name: Backend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: smartcampus-backend/package-lock.json

      - name: Install Dependencies
        run: |
          cd smartcampus-backend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd smartcampus-backend
          npx prisma generate

      - name: Run TypeScript Check & Lint
        run: |
          cd smartcampus-backend
          npm run lint

  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: smartcampus-frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd smartcampus-frontend
          npm ci

      - name: Build Next.js Application
        run: |
          cd smartcampus-frontend
          npm run build
